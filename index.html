<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отделы головного мозга</title>
<style>
/* Layout: liquid-glass study app over a slowly drifting green aurora. One screen at a time: menu, quiz (diagram left, questions right), result. */
:root{
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#e6f4ec;
  --blob-a:rgba(80,210,135,.8);
  --blob-b:rgba(195,238,120,.75);
  --blob-c:rgba(70,200,185,.65);
  --fg:#0c2a1b;
  --fg-dim:#3a5a49;
  --fg-faint:#587a67;
  --glass:rgba(255,255,255,.5);
  --glass-solid:#f3fbf6;
  --glass-2:rgba(255,255,255,.66);
  --glass-3:rgba(255,255,255,.86);
  --glass-edge:rgba(255,255,255,.8);
  --glass-hi:rgba(255,255,255,.95);
  --glass-lo:rgba(10,90,50,.1);
  --glass-shadow:0 18px 40px -16px rgba(10,90,50,.35),0 2px 8px rgba(10,90,50,.08);
  --spec:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%);
  --track:rgba(12,90,50,.12);
  --accent:#16a366;
  --accent-ink:#0b6b41;
  --accent-soft:rgba(22,163,102,.15);
  --btn-bg:linear-gradient(180deg,#0f8d55,#096a3e);
  --btn-fg:#ffffff;
  --btn-glow:rgba(8,100,55,.5);
  --ok-bg:rgba(36,180,110,.17);
  --ok-edge:rgba(15,130,75,.55);
  --ok-ink:#0a6b3f;
  --no-bg:rgba(226,84,72,.14);
  --no-edge:rgba(179,38,30,.5);
  --no-ink:#a3201a;
  --no-btn:#b3261e;
  --no-btn-fg:#ffffff;
  --warn-ink:#8a5600;
  --part-fill:rgba(255,255,255,.62);
  --part-stroke:#2f8a5d;
  --part-on:#3ad28c;
  --part-on-stroke:#08603a;
  --ring:#08603a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06130d;
    --blob-a:rgba(20,140,80,.7);
    --blob-b:rgba(80,150,30,.5);
    --blob-c:rgba(10,130,125,.55);
    --fg:#e5faee;
    --fg-dim:#a9ccb8;
    --fg-faint:#86ab95;
    --glass:rgba(22,52,38,.5);
    --glass-solid:#10281d;
    --glass-2:rgba(32,72,52,.55);
    --glass-3:rgba(44,96,70,.7);
    --glass-edge:rgba(150,255,200,.2);
    --glass-hi:rgba(200,255,225,.3);
    --glass-lo:rgba(0,0,0,.4);
    --glass-shadow:0 20px 44px -16px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
    --spec:linear-gradient(135deg,rgba(190,255,220,.16),rgba(190,255,220,0) 40%);
    --track:rgba(255,255,255,.12);
    --accent:#4be08e;
    --accent-ink:#7df0ae;
    --accent-soft:rgba(75,224,142,.18);
    --btn-bg:linear-gradient(180deg,#63ec9f,#33c677);
    --btn-fg:#03210f;
    --btn-glow:rgba(60,220,130,.4);
    --ok-bg:rgba(60,220,140,.16);
    --ok-edge:rgba(110,240,170,.5);
    --ok-ink:#7df0ae;
    --no-bg:rgba(255,110,100,.14);
    --no-edge:rgba(255,143,134,.5);
    --no-ink:#ff9c94;
    --no-btn:#ff8f86;
    --no-btn-fg:#2a0906;
    --warn-ink:#ffc965;
    --part-fill:rgba(190,255,220,.1);
    --part-stroke:#63bd90;
    --part-on:#3fe08c;
    --part-on-stroke:#c4ffe0;
    --ring:#c4ffe0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06130d;
  --blob-a:rgba(20,140,80,.7);
  --blob-b:rgba(80,150,30,.5);
  --blob-c:rgba(10,130,125,.55);
  --fg:#e5faee;
  --fg-dim:#a9ccb8;
  --fg-faint:#86ab95;
  --glass:rgba(22,52,38,.5);
  --glass-solid:#10281d;
  --glass-2:rgba(32,72,52,.55);
  --glass-3:rgba(44,96,70,.7);
  --glass-edge:rgba(150,255,200,.2);
  --glass-hi:rgba(200,255,225,.3);
  --glass-lo:rgba(0,0,0,.4);
  --glass-shadow:0 20px 44px -16px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
  --spec:linear-gradient(135deg,rgba(190,255,220,.16),rgba(190,255,220,0) 40%);
  --track:rgba(255,255,255,.12);
  --accent:#4be08e;
  --accent-ink:#7df0ae;
  --accent-soft:rgba(75,224,142,.18);
  --btn-bg:linear-gradient(180deg,#63ec9f,#33c677);
  --btn-fg:#03210f;
  --btn-glow:rgba(60,220,130,.4);
  --ok-bg:rgba(60,220,140,.16);
  --ok-edge:rgba(110,240,170,.5);
  --ok-ink:#7df0ae;
  --no-bg:rgba(255,110,100,.14);
  --no-edge:rgba(255,143,134,.5);
  --no-ink:#ff9c94;
  --no-btn:#ff8f86;
  --no-btn-fg:#2a0906;
  --warn-ink:#ffc965;
  --part-fill:rgba(190,255,220,.1);
  --part-stroke:#63bd90;
  --part-on:#3fe08c;
  --part-on-stroke:#c4ffe0;
  --ring:#c4ffe0;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:clamp(16px,4vw,32px);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd,figure{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;aspect-ratio:1}
.blob.a{width:min(78vw,640px);left:-18%;top:-14%;background:radial-gradient(closest-side,var(--blob-a),transparent 72%);animation:drift-a 28s ease-in-out infinite alternate}
.blob.b{width:min(70vw,560px);right:-16%;top:22%;background:radial-gradient(closest-side,var(--blob-b),transparent 72%);animation:drift-b 34s ease-in-out infinite alternate}
.blob.c{width:min(80vw,680px);left:12%;bottom:-26%;background:radial-gradient(closest-side,var(--blob-c),transparent 72%);animation:drift-c 40s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(12vw,10vh) scale(1.12)}}
@keyframes drift-b{to{transform:translate(-10vw,-8vh) scale(1.08)}}
@keyframes drift-c{to{transform:translate(8vw,-10vh) scale(1.15)}}

/* glass */
.glass{background:var(--spec),var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -14px 24px -18px var(--glass-lo);border-radius:28px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-solid)}}

.app{position:relative;z-index:1;width:100%;max-width:1080px;margin-inline:auto;padding-block:14px 56px;display:grid;gap:16px;align-content:start}
.view{display:grid;gap:16px;align-content:start;min-width:0}
.view>*{min-width:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.55;transform:translateY(10px)}}

/* top bar */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 12px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 8px 4px 4px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand .mark{width:32px;height:30px;color:var(--accent-ink);flex:none}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--track)}
.seg button{border:0;background:transparent;color:var(--fg-dim);cursor:pointer;height:34px;min-width:38px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}
.seg button svg{width:18px;height:18px;flex:none}
.seg button .lbl{display:none}
@media(min-width:560px){.seg button .lbl{display:inline}}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* type */
.display{font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;line-height:1.18;text-wrap:balance}
h1.display{font-size:clamp(1.9rem,6.4vw,3.3rem)}
h2.display{font-size:clamp(1.15rem,3.4vw,1.5rem)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
.hint{color:var(--fg-dim);font-size:14.5px}
.lead{color:var(--fg-dim);font-size:clamp(1rem,2.4vw,1.15rem);max-width:46ch}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font-weight:600;border-radius:999px;padding:12px 22px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px var(--btn-glow)}
.btn-ghost{background:var(--glass-2);color:var(--fg);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn-sm{min-height:40px;padding:8px 16px;font-size:14px}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media(hover:hover){.btn-primary:hover:not(:disabled){transform:translateY(-1px)}.btn-ghost:hover:not(:disabled){background:var(--glass-3)}}

/* home */
.hero{padding:18px 4px 4px;display:grid;gap:12px}
.panel{padding:clamp(16px,3vw,26px)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.mode{padding:clamp(18px,3vw,28px);display:grid;gap:14px;align-content:start}
.mode p{color:var(--fg-dim)}
.mode .btn{justify-self:start}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.ref-head{display:grid;gap:6px;margin-bottom:16px}
.ref{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.ref{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.refside{display:grid;gap:14px;align-content:start;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--glass-edge);background:var(--glass-2);color:var(--fg);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-hi)}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.detail{display:grid;gap:10px;padding:16px 18px;border-radius:22px;background:var(--glass-2);border:1px solid var(--glass-edge)}
.detail h3{font-size:1.2rem}
.detail .where{color:var(--fg-dim);font-size:14.5px}
.detail .brief{font-weight:500}
.fx{display:grid;gap:8px}
.fx li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.fx .tick{flex:none;color:var(--ok-ink);margin-top:2px}
.foot{font-size:13px;color:var(--fg-dim);text-align:center;padding:4px 8px}

/* diagram */
.figure{padding:14px;display:grid;gap:8px;margin:0}
.canvas{border-radius:22px;background:var(--glass-2);border:1px solid var(--glass-edge);padding:8px}
.figcap{font-size:13px;color:var(--fg-dim);text-align:center}
.brain{display:block;width:100%;height:auto;max-height:70vh}
.brain .part :is(path,circle,ellipse){fill:var(--part-fill);stroke:var(--part-stroke);stroke-width:1.6;stroke-linejoin:round;transition:fill .3s,stroke .3s}
.brain .part .fold{fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.brain .part .stalk{fill:none;stroke-width:3.5;stroke-linecap:round}
.brain .part.on :is(path,circle,ellipse){fill:var(--part-on);stroke:var(--part-on-stroke)}
.brain .part.on .fold{fill:none}
.brain .part.on .stalk{fill:none;stroke:var(--part-on-stroke)}
.brain .ctx{fill:var(--part-fill);stroke:var(--part-stroke);stroke-width:1.4;opacity:.6}
.brain .lbl{font-size:10.5px;fill:var(--fg-dim);font-family:var(--font-body)}
.brain .ring{fill:none;stroke:var(--ring);stroke-width:2.2;stroke-dasharray:6 5;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.1);opacity:.6}}
.brain .part[tabindex]{cursor:pointer}
.brain .part[tabindex]:focus-visible{outline:none}
.brain .part[tabindex]:focus-visible :is(path,circle,ellipse){stroke:var(--accent);stroke-width:3.2}
@media(hover:hover){.brain .part:not(.on)[tabindex]:hover :is(path,circle,ellipse){fill:var(--accent-soft)}}

/* quiz */
.qhead{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px 14px;padding:12px 14px;border-radius:26px}
.qtitle{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;min-width:0}
.qtitle .display{font-size:1.05rem}
.count{font-size:14px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.prog{grid-column:1/-1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.prog>i{display:block;height:100%;width:var(--w);background:var(--btn-bg);border-radius:inherit;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.exitbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;border-radius:22px}
.exitbar .row{display:flex;gap:8px}
.quiz{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:900px){
  .quiz{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .quiz>.figure{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
}
.q{display:grid;gap:14px;align-content:start}
.q h2:focus{outline:none}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:58px;border-radius:20px;border:1px solid var(--glass-edge);background:var(--glass-2);color:var(--fg);font-weight:500;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-hi);transition:transform .15s,background .2s,opacity .2s}
.opt .key{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}
.opt .otxt{flex:1;min-width:0}
.opt .mark{flex:none;width:22px;height:22px;display:grid;place-items:center}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-edge)}
.opt.ok .mark{color:var(--ok-ink)}
.opt.no{background:var(--no-bg);border-color:var(--no-edge)}
.opt.no .mark{color:var(--no-ink)}
.opt.faded{opacity:.55}
@media(hover:hover){.opt:hover:not(:disabled){transform:translateY(-1px);background:var(--glass-3)}}
.fb{display:grid;gap:12px}
.fb:empty{display:none}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;border:1px solid}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-edge);color:var(--ok-ink)}
.banner.no{background:var(--no-bg);border-color:var(--no-edge);color:var(--no-ink)}
.banner .bico{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor}
.banner strong{font-family:var(--font-display);font-weight:600;font-size:1.05rem;display:block}
.banner p{color:var(--fg);font-size:15px;margin-top:2px}
.recap{display:grid;gap:6px;padding:12px 16px;border-radius:20px;background:var(--glass-2);border:1px solid var(--glass-edge);font-size:15px}
.recap p{color:var(--fg-dim)}
.recap strong{color:var(--fg)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:4px}
.lab{font-weight:600;font-size:14px}
.input{width:100%;min-height:52px;padding:12px 18px;border-radius:18px;border:1px solid var(--glass-edge);background:var(--glass-2);color:var(--fg);font-size:16px;box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 2px 8px var(--glass-lo)}
.input::placeholder{color:var(--fg-faint)}
.stmts{display:grid;gap:10px}
.stmt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:20px;background:var(--glass-2);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi)}
.stmt p{flex:1 1 220px;min-width:0;font-weight:500}
.yn{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:999px;background:var(--track);flex:0 0 auto;width:min(100%,196px)}
.yn button{border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 12px;font-weight:600;font-size:14.5px;color:var(--fg-dim);cursor:pointer}
.yn button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.yn button:disabled{cursor:default}
@media(max-width:520px){.yn{flex:1 1 100%;width:100%}}
.stmt.ok{background:var(--ok-bg);border-color:var(--ok-edge)}
.stmt.no{background:var(--no-bg);border-color:var(--no-edge)}
.stmt.no .yn button[aria-pressed="true"]{background:var(--no-btn);color:var(--no-btn-fg)}
.note{flex:1 1 100%;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.stmt.ok .note{color:var(--ok-ink)}
.stmt.no .note{color:var(--no-ink)}
.note svg{flex:none;margin-top:2px;width:16px;height:16px}

/* results */
.result{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);justify-items:start;padding:clamp(18px,3vw,30px)}
@media(min-width:640px){.result{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:28px}}
.gauge{position:relative;width:172px;height:172px;flex:none}
.gauge svg{width:100%;height:100%;display:block}
.gt{fill:none;stroke:var(--track);stroke-width:12}
.gb{fill:none;stroke-width:12;stroke-linecap:round;stroke:var(--accent);animation:fillg 1.1s .15s cubic-bezier(.2,.8,.2,1) both}
.gb.warn{stroke:var(--warn-ink)}
.gb.bad{stroke:var(--no-btn)}
@keyframes fillg{from{stroke-dashoffset:339.3}}
.gv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gv .display{font-size:2rem;font-variant-numeric:tabular-nums}
.gv small{font-size:13px;color:var(--fg-dim)}
.rtext{display:grid;gap:10px;min-width:0;width:100%}
.grade{display:inline-grid;place-items:center;min-width:1.5em;padding:0 .25em;border-radius:.4em;margin-left:.2em;background:var(--accent-soft);color:var(--accent-ink)}
.grade.warn{background:rgba(190,120,0,.16);color:var(--warn-ink)}
.grade.bad{background:var(--no-bg);color:var(--no-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stats div{padding:10px 14px;border-radius:18px;background:var(--glass-2);border:1px solid var(--glass-edge)}
.stats dt{font-size:12.5px;color:var(--fg-dim)}
.stats dd{font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.scale{font-size:13.5px;color:var(--fg-dim)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:0 4px}
.errs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.err{padding:18px 20px;display:grid;gap:10px;align-content:start}
.err h3{font-size:1.1rem}
.erow,.elist li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ei{flex:none;color:var(--no-ink);margin-top:2px}
.ei svg{width:16px;height:16px;display:block}
.elist{display:grid;gap:10px}
.elist small{display:block;color:var(--fg-dim);font-size:13.5px;margin-top:2px}

const DRAW=['cerebellum','cortex','medulla','pons','midbrain','thalamus','hypothalamus','pineal','pituitary'];

/* ---------- помощники ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2];};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=(a,n)=>shuffle(a).slice(0,n);
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9\s]/g,' ').replace(/\s+/g,' ').trim();
PARTS.forEach(p=>{p.aliases=p.aliases.map(norm);});
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=[];for(let j=0;j<=n;j++)prev[j]=j;for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}return prev[n];}
function checkName(input,p){
  const t=norm(input);
  if(!t)return{ok:false};
  if(p.aliases.includes(t))return{ok:true};
  if(t.length>=6&&p.aliases.some(a=>a.length>=6&&lev(t,a)<=1))return{ok:true,typo:true};
  return{ok:false};
}
function makeStatements(p){
  const maxGood=Math.min(4,p.good.length);
  const minGood=Math.max(2,6-p.bad.length);
  const k=minGood+Math.floor(Math.random()*(maxGood-minGood+1));
  return shuffle(pick(p.good,k).map(t=>({text:t,truth:true})).concat(pick(p.bad,6-k).map(t=>({text:t,truth:false}))));
}
function makeOptions(p){
  const nSim=1+Math.floor(Math.random()*2);
  const sim=shuffle(p.similar).slice(0,nSim);
  const rest=shuffle(PARTS.filter(x=>x.id!==p.id&&!sim.includes(x.id)).map(x=>x.id));
  return shuffle([p.id].concat(sim,rest).slice(0,4));
}
const gradeOf=pct=>pct>=90?{n:5,t:'Отлично',c:'',s:'Отличный результат.'}:pct>=70?{n:4,t:'Хорошо',c:'',s:'Хорошо. Загляни в разбор ошибок и повтори слабые места.'}:pct>=50?{n:3,t:'Удовлетворительно',c:'warn',s:'Зачёт есть, но стоит повторить. Начни с разбора ошибок ниже.'}:{n:2,t:'Нужно повторить',c:'bad',s:'Пока мало. Пройди режим «Учение» и попробуй ещё раз.'};

function brainSVG(on,interactive){
  const parts=DRAW.map(id=>{
    const p=BY_ID[id];
    const attrs=interactive?` tabindex="0" role="button" aria-label="${esc(p.name)}"`:'';
    return(id==='medulla'?CORD:'')+`<g class="part${on===id?' on':''}" data-part="${id}"${attrs}>${p.svg}</g>`;
  }).join('');
  const r=on&&BY_ID[on].ring;
  const ring=r?`<ellipse class="ring" cx="${r[0]}" cy="${r[1]}" rx="${r[2]}" ry="${r[3]}"/>`:'';
  return `<svg class="brain" viewBox="0 0 400 345" role="${interactive?'group':'img'}" aria-label="Схема головного мозга, срединный разрез. Лоб слева, затылок справа.">${parts}<text class="lbl" x="284" y="336">спинной мозг</text>${ring}</svg>`;
}

function setProgress(done,n){
  const pg=view.querySelector('.prog');
  if(!pg)return;
  pg.setAttribute('aria-valuenow',done);
  pg.firstElementChild.style.setProperty('--w',(done/n*100)+'%');
}
function updateFuncUI(){
  const st=S.screen==='learn'?L:T;
  if(!st)return;
  const left=st.marks.filter(m=>m===null).length;
  const need=[];
  if(S.screen==='test'&&!st.name.trim())need.push('ввести название');
  if(left)need.push(`ответить на ${left} ${plural(left,['утверждение','утверждения','утверждений'])}`);
  const btn=document.getElementById('submit'),hint=document.getElementById('left');
  if(btn)btn.disabled=need.length>0;
  if(hint)hint.textContent=need.length?`Осталось: ${need.join(' и ')}.`:'Всё готово, можно отправлять.';
}
function setMark(btn){
  const st=S.screen==='learn'?L:T;
  if(!st||st.submitted)return;
  const i=+btn.dataset.i,v=+btn.dataset.v;
  st.marks[i]=v;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===v)));
  updateFuncUI();
}

 <article class="glass mode"><div class="pills"><span class="pill">9 вопросов</span><span class="pill">С оценкой</span></div><h2 class="display">Проверка знаний</h2><p>Впиши название сам и отметь функции. В конце получишь процент, оценку и разбор ошибок.</p><button type="button" class="btn btn-primary" data-act="start-test">Начать проверку</button></article>
</section>
<section class="glass panel" aria-labelledby="refh"><div class="ref-head"><h2 class="display" id="refh">Схема и функции</h2><p class="hint">Нажми на отдел на схеме или выбери его в списке.</p></div><div id="refbox"></div></section>
<p class="foot">Схема упрощена и показывает срединный разрез мозга. Функции даны по параграфу «Головной мозг» из учебника.</p>`;
}
function detailHTML(p){
  return `<h3 class="display">${esc(p.name)}</h3><p class="where">${esc(p.where)}</p><p class="brief">${esc(p.brief)}</p><ul class="fx">${p.good.map(g=>`<li><span class="tick">${icon('check')}</span><span>${esc(g)}</span></li>`).join('')}</ul>`;
}
function refHTML(){
  const p=BY_ID[S.ref];
  return `<div class="ref"><div class="canvas">${brainSVG(S.ref,true)}</div><div class="refside"><div class="chips" role="group" aria-label="Отделы мозга">${PARTS.map(x=>`<button type="button" class="chip" data-act="ref" data-id="${x.id}" aria-pressed="${x.id===S.ref}">${esc(x.name)}</button>`).join('')}</div><article class="detail" id="detail" aria-live="polite">${detailHTML(p)}</article></div></div>`;
}
function selectRef(id){
  S.ref=id;
  const box=document.getElementById('refbox');
  if(!box)return;
  box.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.id===id)));
  box.querySelectorAll('.part').forEach(g=>g.classList.toggle('on',g.dataset.part===id));
  const svg=box.querySelector('svg.brain');
  const old=svg.querySelector('.ring');
  if(old)old.remove();
  const r=BY_ID[id].ring;
  if(r){
    const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    e.setAttribute('class','ring');
    e.setAttribute('cx',r[0]);e.setAttribute('cy',r[1]);e.setAttribute('rx',r[2]);e.setAttribute('ry',r[3]);
    svg.appendChild(e);
  }
  document.getElementById('detail').innerHTML=detailHTML(BY_ID[id]);
}

/* ---------- режим 1: учение ---------- */
function startLearn(ids){
  L={order:shuffle(ids||PARTS.map(p=>p.id)),i:0,results:[]};
  prepLearn();
  S.screen='learn';
  render();
}
function prepLearn(){
  const p=BY_ID[L.order[L.i]];
  L.stage='name';L.picked=null;L.opts=makeOptions(p);L.stmts=makeStatements(p);
  L.marks=new Array(6).fill(null);L.submitted=false;L.cur={nameOk:null,funcOk:null,wrong:0};
}
function learnHTML(){
  const p=BY_ID[L.order[L.i]],n=L.order.length;
  const head=qhead('Учение',`Отдел ${L.i+1} из ${n}`,L.i,n,false);
  let panel;
  if(L.stage==='name'){
    panel=`<section class="glass panel q"><p class="eyebrow">Шаг 1 из 2</p><h2 class="display" tabindex="-1" data-focus>Что это за отдел?</h2><p class="hint">Смотри на выделенное место на схеме и выбери название.</p><div class="opts">${L.opts.map((id,k)=>`<button type="button" class="opt" data-act="pick" data-id="${id}"><span class="key">${'АБВГ'[k]}</span><span class="otxt">${esc(BY_ID[id].name)}</span><span class="mark"></span></button>`).join('')}</div><div id="fb" class="fb" aria-live="polite"></div></section>`;
  }else{
    panel=`<section class="glass panel q"><p class="eyebrow">Шаг 2 из 2</p><h2 class="display" tabindex="-1" data-focus>${esc(p.name)}</h2><p class="hint">Что делает этот отдел? Для каждого утверждения выбери «Верно» или «Неверно».</p>${stmtsHTML(L.stmts)}<div class="actions"><button type="button" class="btn btn-primary" id="submit" data-act="submit-learn" disabled>Отправить</button><span class="hint" id="left"></span></div><div id="fb" class="fb" aria-live="polite"></div></section>`;
  }
  return head+`<div class="quiz">${figureHTML(p.id)}${panel}</div>`;
}
function pickName(id){
  if(L.picked)return;
  const p=BY_ID[L.order[L.i]];
  L.picked=id;
  const ok=id===p.id;
  L.cur.nameOk=ok;
  view.querySelectorAll('.opt').forEach(b=>{
    const bid=b.dataset.id;
    b.disabled=true;
    b.classList.toggle('ok',bid===p.id);
    b.classList.toggle('no',bid===id&&!ok);
    b.classList.toggle('faded',bid!==p.id&&bid!==id);
    b.querySelector('.mark').innerHTML=bid===p.id?icon('check'):(bid===id?icon('cross'):'');
  });
  const fb=document.getElementById('fb');
  fb.innerHTML=banner(ok,ok?'Верно!':'Не верно',ok?`Это ${esc(lc(p.name))}.`:`Это ${esc(lc(p.name))}, а не ${esc(lc(BY_ID[id].name))}.`)+recap('Где находится.',p.where)+`<button type="button" class="btn btn-primary" data-act="tofunc">К функциям</button>`;
  const nb=fb.querySelector('button');
  if(nb)nb.focus({preventScroll:true});
}
function submitLearn(){
  if(L.submitted)return;
  const p=BY_ID[L.order[L.i]],n=L.order.length;
  L.submitted=true;
  let wrong=0;
  L.stmts.forEach((s,i)=>{
    const ok=(L.marks[i]===1)===s.truth;
    if(!ok)wrong++;
    const row=view.querySelector(`.stmt[data-i="${i}"]`);
    row.classList.add(ok?'ok':'no');
    row.querySelectorAll('.yn button').forEach(b=>{b.disabled=true;});
    const note=row.querySelector('.note');
    note.hidden=false;
    note.innerHTML=icon(ok?'check':'cross')+'<span>'+(ok?(s.truth?'Правильно: это функция отдела.':'Правильно: это не функция отдела.'):(s.truth?'Ошибка: на самом деле это функция отдела.':'Ошибка: на самом деле это не функция отдела.'))+'</span>';
  });
  L.cur.funcOk=wrong===0;L.cur.wrong=wrong;
  L.results.push({id:p.id,nameOk:L.cur.nameOk,funcOk:L.cur.funcOk,wrong});
  setProgress(L.i+1,n);
  const last=L.i+1>=n;
  const act=view.querySelector('.actions');
  if(act)act.hidden=true;
  const fb=document.getElementById('fb');
  fb.innerHTML=banner(wrong===0,wrong===0?'Верно!':'Не верно',wrong===0?'Все функции определены правильно.':`Ошибок: ${wrong} из ${L.stmts.length}. Посмотри пояснения под утверждениями.`)+recap('Запомни.',p.brief)+`<button type="button" class="btn btn-primary" data-act="next-learn">${last?'Завершить':'Дальше'}</button>`;
  const nb=fb.querySelector('button');
  if(nb)nb.focus({preventScroll:true});
}
function nextLearn(){
  if(L.i+1<L.order.length){L.i++;prepLearn();render();}
  else{S.screen='learnDone';render();}
}
function learnDoneHTML(){
  const R=L.results,n=R.length;
  const names=R.filter(r=>r.nameOk).length,funcs=R.filter(r=>r.funcOk).length;
  const failed=R.filter(r=>!(r.nameOk&&r.funcOk));
  const rows=R.map(r=>{const ok=r.nameOk&&r.funcOk;return `<li class="rrow ${ok?'ok':'no'}"><span class="ricon">${icon(ok?'check':'cross')}</span><span class="rname">${esc(BY_ID[r.id].name)}</span><span class="rdet">название ${r.nameOk?'верно':'не верно'} · функции ${r.funcOk?'верно':'ошибок: '+r.wrong}</span></li>`;}).join('');
  return `<section class="glass panel q"><p class="eyebrow">Учение завершено</p><h2 class="display" tabindex="-1" data-focus>${failed.length?'Круг пройден':'Без ошибок'}</h2><dl class="stats"><div><dt>Названия</dt><dd>${names} из ${n}</dd></div><div><dt>Функции без ошибок</dt><dd>${funcs} из ${n}</dd></div></dl><ul class="rlist">${rows}</ul><div class="endact">${failed.length?`<button type="button" class="btn btn-primary" data-act="retry-errors">Повторить ошибки (${failed.length})</button>`:''}<button type="button" class="btn ${failed.length?'btn-ghost':'btn-primary'}" data-act="start-learn">Пройти заново</button><button type="button" class="btn btn-ghost" data-act="go-home">В меню</button></div></section>`;
}

/* ---------- режим 2: проверка знаний ---------- */
function startTest(){
  T={order:shuffle(PARTS.map(p=>p.id)),i:0,answers:[]};
  prepTest();
  S.screen='test';
  render();
}
function prepTest(){
  const p=BY_ID[T.order[T.i]];
  T.stmts=makeStatements(p);T.marks=new Array(6).fill(null);T.name='';T.submitted=false;
}
function testHTML(){
  const p=BY_ID[T.order[T.i]],n=T.order.length,last=T.i+1>=n;
  return qhead('Проверка знаний',`Вопрос ${T.i+1} из ${n}`,T.i,n,true)
  +`<div class="quiz">${figureHTML(p.id)}<section class="glass panel q"><p class="eyebrow">Результат — в конце</p><h2 class="display" tabindex="-1" data-focus>Назови отдел и отметь функции</h2><label class="lab" for="nameInput">Название отдела</label><input id="nameInput" class="input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="Впиши название"><p class="hint">Для каждого утверждения выбери «Верно» или «Неверно».</p>${stmtsHTML(T.stmts)}<div class="actions"><button type="button" class="btn btn-primary" id="submit" data-act="submit-test" disabled>${last?'Завершить':'Ответить'}</button><span class="hint" id="left"></span></div></section></div>`;
}
function submitTest(){
  const p=BY_ID[T.order[T.i]];
  if(T.marks.some(m=>m===null)||!T.name.trim())return;
  T.answers.push({id:p.id,typed:T.name.trim(),name:checkName(T.name,p),stmts:T.stmts.map((s,i)=>({text:s.text,truth:s.truth,mark:T.marks[i]}))});
  if(T.i+1<T.order.length){T.i++;prepTest();render();}
  else{S.screen='result';render();}
}
function errHTML(a){
  const p=BY_ID[a.id];
  const bad=a.stmts.filter(s=>(s.mark===1)!==s.truth);
  if(a.name.ok&&!bad.length)return '';
  const nameRow=a.name.ok?'':`<p class="erow"><span class="ei">${icon('cross')}</span><span><strong>Название.</strong> Ты написал «${esc(a.typed)}». Правильно: «${esc(p.name)}».</span></p>`;
  const items=bad.map(s=>`<li><span class="ei">${icon('cross')}</span><span>${esc(s.text)}<small>Ты ответил: ${s.mark===1?'верно':'неверно'}. На самом деле: ${s.truth?'это функция отдела':'это не функция этого отдела'}.</small></span></li>`).join('');
  return `<article class="glass err"><h3 class="display">${esc(p.name)}</h3>${nameRow}${bad.length?`<p class="eh">Функции с ошибкой</p><ul class="elist">${items}</ul>`:''}<p class="recap2"><strong>Запомни.</strong> ${esc(p.brief)}</p></article>`;
}
function scoreTest(){
  const A=T.answers;
  let total=0,names=0,fOk=0,fAll=0,typos=0,errors=0;
  A.forEach(a=>{
    const nOk=a.name.ok?1:0;
    const fc=a.stmts.filter(s=>(s.mark===1)===s.truth).length;
    total+=nOk+fc/a.stmts.length;
    names+=nOk;fOk+=fc;fAll+=a.stmts.length;
    if(a.name.ok&&a.name.typo)typos++;
    errors+=(nOk?0:1)+(a.stmts.length-fc);
  });
  return{pct:Math.round(total/(2*A.length)*100),names,fOk,fAll,typos,errors};
}
function resultHTML(){
  const A=T.answers,n=A.length,sc=scoreTest(),g=gradeOf(sc.pct);
  const C=2*Math.PI*54;
  const errs=A.map(errHTML).filter(Boolean);
  const gauge=`<div class="gauge"><svg viewBox="0 0 140 140" aria-hidden="true"><circle class="gt" cx="70" cy="70" r="54"/><circle class="gb ${g.c}" cx="70" cy="70" r="54" transform="rotate(-90 70 70)" style="stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${(C*(1-sc.pct/100)).toFixed(1)}"/></svg><div class="gv"><span class="display">${sc.pct}%</span><small>верно</small></div></div>`;
  const top=`<section class="glass result">${gauge}<div class="rtext"><p class="eyebrow">Результат проверки</p><h2 class="display" tabindex="-1" data-focus>Оценка <span class="grade ${g.c}">${g.n}</span></h2><p class="lead">${esc(g.t)}. ${esc(g.s)}</p><dl class="stats"><div><dt>Названия</dt><dd>${sc.names} из ${n}</dd></div><div><dt>Функции</dt><dd>${sc.fOk} из ${sc.fAll}</dd></div><div><dt>Ошибок</dt><dd>${sc.errors}</dd></div></dl><p class="scale">Шкала: 90–100% — «5», 70–89% — «4», 50–69% — «3», меньше 50% — «2». Название и функции дают по половине балла за вопрос.</p>${sc.typos?`<p class="scale">В некоторых названиях была опечатка. Ответ засчитан.</p>`:''}</div></section>`;
  const body=errs.length
    ?`<div class="sec-head"><h2 class="display">Разбор ошибок</h2><span class="hint">Отделов с ошибками: ${errs.length}</span></div><div class="errs">${errs.join('')}</div>`
    :`<section class="glass clean"><span class="bico">${icon('check')}</span><div><h2 class="display">Ошибок нет</h2><p class="hint">Все названия и функции отмечены верно.</p></div></section>`;
  return top+body+`<div class="endact"><button type="button" class="btn btn-primary" data-act="start-test">Пройти ещё раз</button><button type="button" class="btn btn-ghost" data-act="go-home">В меню</button></div>`;
}

/* ---------- отрисовка ---------- */
function render(o){
  o=o||{};
  let html='';
  if(S.screen==='home')html=homeHTML();
  else if(S.screen==='learn')html=learnHTML();
  else if(S.screen==='learnDone')html=learnDoneHTML();
  else if(S.screen==='test')html=testHTML();
  else if(S.screen==='result')html=resultHTML();
  view.innerHTML=html;
  if(S.screen==='home'){const box=document.getElementById('refbox');if(box)box.innerHTML=refHTML();}
  if((S.screen==='learn'&&L.stage==='func')||S.screen==='test')updateFuncUI();
  if(!o.noFocus){
    try{window.scrollTo(0,0);}catch(e){}
    const f=view.querySelector('[data-focus]');
    if(f)f.focus({preventScroll:true});
  }
}

/* ---------- события ---------- */
const ACTS={
  'go-home':()=>{S.screen='home';L=null;T=null;render();},
  'start-learn':()=>startLearn(),
  'retry-errors':()=>startLearn(L.results.filter(r=>!(r.nameOk&&r.funcOk)).map(r=>r.id)),
  'start-test':()=>startTest(),
  'ref':t=>selectRef(t.dataset.id),
  'pick':t=>pickName(t.dataset.id),
  'tofunc':()=>{L.stage='func';render();},
  'mark':t=>setMark(t),
  'submit-learn':()=>submitLearn(),
  'next-learn':()=>nextLearn(),
  'submit-test':()=>submitTest(),
  'exit-ask':()=>{const b=document.getElementById('exitbar');if(b){b.hidden=false;const s=b.querySelector('button');if(s)s.focus({preventScroll:true});}},
  'exit-no':()=>{const b=document.getElementById('exitbar');if(b)b.hidden=true;}
};
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-theme-set]');
  if(th){setTheme(th.dataset.themeSet);return;}
  const part=e.target.closest('[data-part]');
  if(part&&S.screen==='home'&&part.hasAttribute('tabindex')){selectRef(part.dataset.part);return;}
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const f=ACTS[t.dataset.act];
  if(f)f(t);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const part=e.target.closest&&e.target.closest('g[data-part][tabindex]');
  if(part&&S.screen==='home'){e.preventDefault();selectRef(part.dataset.part);}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='nameInput'&&T){T.name=e.target.value;updateFuncUI();}
});

/* ---------- тема ---------- */
const root=document.documentElement;
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function effTheme(){const a=root.getAttribute('data-theme');return a==='dark'||a==='light'?a:(mq&&mq.matches?'dark':'light');}
function syncTheme(){const t=effTheme();document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));}
function setTheme(t){root.setAttribute('data-theme',t);try{localStorage.setItem('brain-theme',t);}catch(e){}syncTheme();}
try{const s=localStorage.getItem('brain-theme');if(s==='light'||s==='dark')root.setAttribute('data-theme',s);}catch(e){}
if(mq&&mq.addEventListener)mq.addEventListener('change',syncTheme);
syncTheme();

render({noFocus:true});

/* для проверки в тестах */
window.__brain={PARTS,checkName,makeStatements,makeOptions,gradeOf};
})();
</script>
